name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test online starter
        run: |
          python3 tools/build_release.py
          /bin/bash -n dist/setup-mac.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test original Claude Code setup without installing software
        working-directory: claude-gateway-setup
        run: |
          node --test tests/configure.test.cjs tests/dialogs.test.cjs tests/prepared.test.cjs
          /usr/bin/ruby tests/mac_test.rb
          python3 tests/terminal_test.py
          python3 tests/mac_terminal_test.py
          python3 tests/windows_static_test.py
          python3 build_packages.py
          python3 tests/distribution_test.py
      - name: Test original Codex configuration without touching user profiles
        run: /usr/bin/ruby codex-gateway-setup/mac/辅助文件/test_setup.rb

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release assets
        run: python tools/build_release.py
      - name: Test Windows starter and original Codex config core
        shell: powershell
        run: |
          & ./tests/windows_bootstrap.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & './codex-gateway-setup/windows/辅助文件/SelfTest.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'k0x7q/ai-gateway-setup'
    needs: [mac-tests, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure tag matches tested version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,pathlib; assert pathlib.Path("VERSION").read_text().strip() == os.environ["RELEASE_TAG"], "Tag must match VERSION"'
      - name: Build release
        run: python tools/build_release.py
      - name: Upload draft and publish only when complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/publish_release.py --version "$RELEASE_TAG"
